<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Family Manager - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>Steam Family Manager</h1>
        <button class="btn btn-accent" id="logout-btn">Logout</button>
    </header>

    <main class="dashboard-content">
        <section class="add-member-section">
            <h2>Add Family Member</h2>
            <form id="add-member-form" class="add-member-form">
                <input type="text" id="steam-id-input" placeholder="Steam ID (17 digits)" pattern="\d{17}" maxlength="17" required>
                <button type="submit" class="btn btn-accent">Add Member</button>
                <button type="button" class="btn btn-success" id="sync-all-btn" onclick="handleSyncAll()">Sync All</button>
            </form>
        </section>

        <section id="members-grid" class="members-grid">
            <div class="loading">Loading members...</div>
        </section>
    </main>

    <!-- Games modal -->
    <div class="modal-backdrop" id="games-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="games-modal-title">Games</h2>
                <button class="modal-close" id="games-modal-close">&times;</button>
            </div>
            <div class="modal-body" id="games-list"></div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/members.js"></script>
    <script src="js/games.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
