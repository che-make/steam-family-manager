# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/your_template_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# OpenAI Properties
spring.ai.openai.api-key=${OPENAI_API_KEY}

# JWT Secret
# Change in JwtService @Value
yourappname.auth.jwt.secret=${JWT_SECRET}

# Password Reset
password.reset.token.expiry=24
otp.expiry=1

# Mail
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Cors
cors.allowedOrigins=https://prod.yourdomainweb.com/

# S3
aws.s3.access-key=${S3_ACCESS_KEY}
aws.s3.secret-key=${S3_SECRET_KEY}

# SSL Configuration
server.port=8443
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=/home/keys.p12
server.ssl.key-store-password=${PASS_CERT_TEMPLATE_BACK}
server.ssl.key-alias=certificate_backend