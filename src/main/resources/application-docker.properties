# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/steam_family_manager?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# No SSL (reverse proxy handles HTTPS in production)
server.port=8080

# Cors
cors.allowedOrigins=https://chemake.dev,http://localhost:8080,http://localhost:3000

# Admin credentials
admin.default.email=${ADMIN_EMAIL:admin@steamfamily.com}
admin.default.password=${ADMIN_PASSWORD:admin}
