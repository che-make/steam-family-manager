# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/steam_family_manager_preprod?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cors
cors.allowedOrigins=https://preprod.yourdomain.com/

# Admin credentials
admin.default.email=${ADMIN_EMAIL:admin@steamfamily.com}
admin.default.password=${ADMIN_PASSWORD:admin}

# SSL Configuration
server.port=8443
server.ssl.enabled=true
server.ssl.key-store-type=PKCS12
server.ssl.key-store=/home/keys.p12
server.ssl.key-store-password=${PASS_CERT_BACK}
server.ssl.key-alias=certificate_backend
